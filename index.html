<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Time & Jet Lag Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e9eff8;
      --surface: #ffffff;
      --surface-2: #f0f4fa;
      --line: rgba(12, 22, 52, .09);
      --text: #0a1228;
      --sub: #4d5873;
      --muted: #8089a3;
      --accent: #2f66ff;
      --accent-ink: #ffffff;
      --accent-soft: rgba(47, 102, 255, .1);
      --origin: #2b72ff;
      --dest: #f08a00;
      --sun: #ffb21e;
      --dusk: #ff7a59;
      --glass: rgba(255, 255, 255, .8);
      --on-origin: #ffffff; --on-dest: #2a1700; --on-good: #ffffff;
      --land: #d3dbea;
      --land-line: #bfcadf;
      --ocean: #e3ebf7;
      --grid: rgba(60, 80, 130, .12);
      --good: #0a8f5f; --good-soft: rgba(10, 143, 95, .12);
      --warn: #b86a00; --warn-soft: rgba(240, 138, 0, .14);
      --bad: #d23a3a; --bad-soft: rgba(210, 58, 58, .12);
      --shadow: 0 1px 2px rgba(10, 20, 50, .05), 0 10px 30px rgba(10, 20, 50, .06);
      --pop-shadow: 0 24px 60px rgba(10, 20, 50, .28), 0 4px 14px rgba(10, 20, 50, .12);
      --display: 'Bricolage Grotesque', 'Hanken Grotesk', system-ui, sans-serif;
      --ui: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    [data-theme="dark"] {
      --bg: #060a16;
      --surface: #0e1527;
      --surface-2: #151e38;
      --line: rgba(255, 255, 255, .08);
      --text: #eef2fc;
      --sub: #a0abc6;
      --muted: #6c7794;
      --accent: #8ab4ff;
      --accent-ink: #061030;
      --accent-soft: rgba(138, 180, 255, .13);
      --origin: #7bb4ff;
      --dest: #ffbf4d;
      --sun: #ffc85a;
      --glass: rgba(12, 19, 38, .74);
      --on-origin: #06143a; --on-dest: #2a1700; --on-good: #04251a;
      --land: #222c49;
      --land-line: #2f3b60;
      --ocean: #0a1122;
      --grid: rgba(150, 170, 230, .08);
      --good: #4fd6a0; --good-soft: rgba(79, 214, 160, .14);
      --warn: #ffbf4d; --warn-soft: rgba(255, 191, 77, .14);
      --bad: #ff7f7f; --bad-soft: rgba(255, 127, 127, .14);
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 12px 34px rgba(0, 0, 0, .35);
      --pop-shadow: 0 24px 60px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 255, 255, .05);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    button { font-family: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    body {
      font-family: var(--ui);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: 1.6rem 1.25rem 4.5rem;
      transition: background .25s, color .25s;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: ''; position: absolute; inset: 0 0 auto 0; height: 640px; z-index: -1; pointer-events: none;
      background:
        radial-gradient(900px 420px at 12% -8%, color-mix(in srgb, var(--origin) 22%, transparent), transparent 70%),
        radial-gradient(700px 360px at 92% 0%, color-mix(in srgb, var(--sun) 16%, transparent), transparent 70%);
    }
    .container { max-width: 1180px; margin: 0 auto; }

    /* ── Header ── */
    .top-bar { display: flex; justify-content: space-between; align-items: flex-end; gap: 1.5rem; margin-bottom: 1.4rem; }
    h1 { font-family: var(--display); font-size: clamp(1.9rem, 4.6vw, 3rem); font-weight: 800; letter-spacing: -.04em; line-height: 1; margin-bottom: .6rem; font-variation-settings: 'opsz' 96; }
    .subtitle { font-size: 1rem; color: var(--sub); line-height: 1.55; max-width: 34rem; }
    .tools { display: flex; gap: .5rem; flex-shrink: 0; align-items: center; }
    .seg { display: flex; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 3px; backdrop-filter: blur(12px); }
    .seg button { border: none; background: transparent; color: var(--sub); font-size: .8rem; font-weight: 700; padding: .4rem .8rem; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s; }
    .seg button.on { background: var(--text); color: var(--bg); }
    .icon-btn { width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: var(--glass); border: 1px solid var(--line); border-radius: 50%; cursor: pointer; color: var(--sub); backdrop-filter: blur(12px); transition: color .15s, border-color .15s; }
    .icon-btn:hover { color: var(--text); border-color: var(--muted); }

    /* ── Planner ── */
    .planner { display: grid; grid-template-columns: minmax(0, 2.6fr) minmax(0, 1.25fr) minmax(0, 1fr); gap: .75rem; align-items: end; margin-bottom: .9rem; padding: .85rem; border-radius: 22px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(16px) saturate(1.3); box-shadow: var(--shadow); }
    .route-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: .45rem; align-items: end; }
    .field { display: flex; flex-direction: column; gap: .35rem; min-width: 0; }
    .label { font-size: .78rem; font-weight: 600; color: var(--muted); padding-left: .2rem; }
    .trigger { display: flex; align-items: center; gap: .65rem; width: 100%; text-align: left; padding: .65rem .8rem; min-height: 54px; background: var(--surface-2); border: 1.5px solid transparent; border-radius: 15px; cursor: pointer; transition: border-color .15s, background .15s; font-size: 1rem; font-weight: 600; }
    .trigger:hover { border-color: var(--line); background: var(--surface); }
    .trigger.open { border-color: var(--accent); background: var(--surface); }
    .trigger .t-main { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: -.01em; }
    .trigger .t-code { font-size: .8rem; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
    .trigger .chev, .trigger .ico { color: var(--muted); flex-shrink: 0; display: flex; }
    .swap-btn { width: 40px; height: 40px; margin-bottom: 7px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--sub); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .3s, color .15s, border-color .15s; }
    .swap-btn:hover { color: var(--accent); border-color: var(--accent); transform: rotate(180deg); }
    .cc { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 20px; padding: 0 5px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); font-size: .66rem; font-weight: 800; color: var(--sub); flex-shrink: 0; }
    .fl { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: block; box-shadow: 0 0 0 1px var(--line); background: var(--surface-2); }
    .fl.sm { width: 18px; height: 18px; }
    .fl.lg { width: 44px; height: 44px; }

    /* ── Layout ── */
    .container { max-width: 1480px; }
    html { scrollbar-gutter: stable; }
    .layout { display: grid; grid-template-columns: minmax(0, 320px) minmax(0, 1fr) minmax(0, 320px); gap: .9rem; align-items: stretch; }
    .stage-col { min-width: 0; grid-column: 2; grid-row: 1; }
    .stage { height: 100%; }
    .below { grid-column: 2; grid-row: 2; min-width: 0; display: grid; gap: .9rem; margin-top: .1rem; }
    #railL { grid-column: 1; grid-row: 1; } #railR { grid-column: 3; grid-row: 1; }
    /* rails are exactly as tall as the globe: contain:size stops them stretching the row, leftover space is shared between the cards */
    .rail { display: flex; flex-wrap: wrap; gap: .75rem; align-content: stretch; min-width: 0; contain: size; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; border-radius: 22px; }
    .rail::-webkit-scrollbar { display: none; }
    .widget { flex: 0 0 100%; display: flex; flex-direction: column; min-width: 0; }
    .widget.half, .w-ph.half { flex: 0 0 calc(50% - .375rem); }
    .w-ph { flex: 0 0 100%; border-radius: 22px; }

    /* ── Globe stage ── */
    .stage { position: relative; border-radius: 28px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow); }
    .globe-wrap { position: relative; height: clamp(640px, 50vw, 760px); overflow: hidden; touch-action: pan-y; background: radial-gradient(ellipse at 50% 42%, #10224a 0%, #060c1f 62%, #03060f 100%); }
    [data-theme="light"] .globe-wrap { background: radial-gradient(ellipse at 50% 42%, #f4f9ff 0%, #dbe9fb 60%, #c5daf6 100%); }
    #globe { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; touch-action: none; }
    #globe.drag { cursor: grabbing; }
    #mapTip { position: absolute; pointer-events: none; z-index: 5; background: var(--text); color: var(--bg); font-size: .78rem; font-weight: 600; padding: .38rem .65rem; border-radius: 9px; white-space: nowrap; transform: translate(-50%, -150%); opacity: 0; transition: opacity .12s; }
    #mapTip.on { opacity: 1; }
    #mapTip small { display: block; font-weight: 500; opacity: .7; font-size: .7rem; }
    .map-ctrls { position: absolute; top: 12px; right: 12px; z-index: 6; display: flex; flex-direction: column; gap: 6px; }
    .map-ctrls button { width: 36px; height: 36px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(12px); color: var(--sub); border-radius: 12px; cursor: pointer; font-size: 1.1rem; line-height: 1; display: flex; align-items: center; justify-content: center; transition: color .15s, border-color .15s; }
    .map-ctrls button:hover { color: var(--text); border-color: var(--muted); }
    .clocks { position: absolute; left: 12px; top: 12px; z-index: 6; display: grid; gap: 6px; }
    .clock { display: flex; align-items: center; gap: .5rem; padding: .4rem .7rem; border-radius: 12px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(12px); font-variant-numeric: tabular-nums; }
    .clock i { display: block; width: 8px; height: 8px; border-radius: 50%; }
    .clock .c-code { font-size: .72rem; font-weight: 700; color: var(--muted); }
    .clock .c-time { font-family: var(--display); font-weight: 700; font-size: 1.05rem; letter-spacing: -.01em; }
    .flightbar { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 6; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 1rem; padding: .55rem .9rem .55rem .55rem; border-radius: 20px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(16px) saturate(1.3); box-shadow: var(--shadow); }
    .play { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--sun); color: #2a1a00; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform .15s; flex-shrink: 0; }
    .play:hover { transform: scale(1.06); }
    .scrub-wrap { min-width: 0; }
    .scrub-top { display: flex; justify-content: space-between; font-size: .78rem; font-weight: 600; color: var(--sub); margin-bottom: .35rem; font-variant-numeric: tabular-nums; }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 999px; background: linear-gradient(90deg, var(--sun) var(--p, 0%), color-mix(in srgb, var(--muted) 35%, transparent) var(--p, 0%)); outline: none; cursor: pointer; display: block; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--sun); box-shadow: 0 2px 8px rgba(0, 0, 0, .35); }
    input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #fff; border: 3px solid var(--sun); }
    .map-hint { font-size: .8rem; color: var(--muted); margin: -.3rem .3rem 0; }

    /* ── Widgets ── */
    .widget { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; transition: border-color .15s; }
    .widget:not(.open):hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
    .w-head { display: flex; align-items: center; justify-content: space-between; gap: .6rem; padding: .95rem .95rem .1rem 1.15rem; }
    .w-head h2 { font-family: var(--display); font-size: .98rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; }
    .w-exp { width: 30px; height: 30px; flex-shrink: 0; border: none; border-radius: 10px; background: var(--surface-2); color: var(--sub); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: color .15s, background .15s; }
    .w-exp:hover { color: var(--accent); background: var(--accent-soft); }
    .w-exp .ic-x { display: none; } .widget.open .w-exp .ic-x { display: block; } .widget.open .w-exp .ic-e { display: none; }
    .w-compact { padding: .3rem 1.15rem 1.1rem; cursor: pointer; flex: 1 0 auto; display: flex; flex-direction: column; justify-content: center; }
    .widget.half .w-head { padding-right: .7rem; } .widget.half .w-head h2 { font-size: .92rem; }
    .widget.half .w-compact { padding: .2rem .95rem 1rem 1.15rem; }
    .widget .t-l { display: none; } .widget.open .t-l { display: inline; } .widget.open .t-s { display: none; }
    .widget.half .cw-big { font-size: 2.1rem; } .widget.half .cw-top .cw-unit { display: block; margin-top: .25rem; }
    .w-full { display: none; }
    .widget.open { position: fixed; z-index: 120; inset: 0; margin: auto; width: min(940px, 94vw); height: fit-content; max-height: 90vh; overflow: auto; box-shadow: var(--pop-shadow); display: block; }
    .widget.flying { position: fixed; z-index: 120; margin: 0; overflow: hidden; box-shadow: var(--pop-shadow); display: block; }
    .widget.flying .w-full { display: block; position: absolute; left: 0; right: 0; top: 3.4rem; pointer-events: none; }
    .widget.flying .w-compact { display: block; }
    .widget.open .w-compact { display: none; } .widget.open .w-full { display: block; padding-bottom: .4rem; }
    .w-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 1.1rem; padding: .8rem 1.5rem 0; }
    .w-facts b { display: block; font-family: var(--display); font-size: 1.5rem; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .w-facts span { font-size: .84rem; color: var(--muted); }
    .w-note { padding: 1rem 1.5rem 1.5rem; color: var(--sub); font-size: .93rem; line-height: 1.6; }
    .widget.open .w-head { position: sticky; top: 0; z-index: 3; background: var(--surface); padding: 1.2rem 1.2rem .5rem 1.5rem; }
    .widget.open .w-head h2 { font-size: 1.4rem; letter-spacing: -.02em; }
    .w-full .panel-title { display: none; } .w-full.keep-title .panel-title { display: block; }
    .w-full .panel-h { padding: .1rem 1.5rem .5rem; }
    #wBackdrop { position: fixed; inset: 0; background: rgba(4, 8, 20, .62); backdrop-filter: blur(3px); z-index: 110; opacity: 0; pointer-events: none; transition: opacity .32s ease; }
    #wBackdrop.on { opacity: 1; pointer-events: auto; }
    body.lock { overflow: hidden; }
    .cw-top { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
    .cw-big { font-family: var(--display); font-weight: 800; font-size: 2.3rem; letter-spacing: -.045em; line-height: 1; font-variant-numeric: tabular-nums; }
    .cw-big.sm { font-size: 1.4rem; letter-spacing: -.03em; }
    .cw-unit { font-size: .92rem; font-weight: 600; color: var(--sub); }
    .cw-sub { font-size: .86rem; color: var(--sub); line-height: 1.5; margin-top: .45rem; }
    .cw-sub.strong { color: var(--text); font-weight: 600; margin-top: 0; }
    .cw-sub.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 0; }
    .cw-stats { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; margin-top: .7rem; }
    .cw-stats b { display: block; font-family: var(--display); font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .cw-stats span { font-size: .76rem; color: var(--muted); }
    .w-compact .meter { padding: .8rem 0 0; }
    .mini-rail { display: flex; align-items: center; justify-content: space-between; gap: 4px; margin: .1rem 0 .8rem; position: relative; }
    .mini-rail::before { content: ''; position: absolute; left: 6px; right: 6px; top: 50%; height: 2px; background: color-mix(in srgb, var(--muted) 35%, transparent); transform: translateY(-50%); }
    .mini-rail i { position: relative; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2.5px solid #7a86ff; z-index: 1; }
    .mini-rail i.tv { width: 18px; height: 18px; background: var(--sun); border-color: var(--surface); box-shadow: 0 0 0 2.5px var(--sun); }
    .mini-rail i.po { border-color: var(--dest); }
    .wxc { display: flex; align-items: center; gap: .55rem; padding: .35rem 0; font-variant-numeric: tabular-nums; }
    .wxc + .wxc { border-top: 1px solid var(--line); }
    .wxc .who { display: inline-flex; align-items: center; gap: .4rem; font-size: .8rem; font-weight: 700; min-width: 58px; }
    .wxc svg { width: 24px; height: 24px; color: var(--sun); flex-shrink: 0; }
    .wxc b { font-family: var(--display); font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; }
    .wxc span:last-child { font-size: .8rem; color: var(--sub); margin-left: auto; text-align: right; }
    #meetC .cw-tag { display: inline-block; font-size: .78rem; font-weight: 700; padding: .22rem .65rem; border-radius: 999px; background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--sub); }
    #meetC .cw-tag.good { background: var(--good-soft); color: var(--good); }
    #meetC .cw-times { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem; margin-top: .6rem; font-variant-numeric: tabular-nums; }
    #meetC .cw-times b { font-family: var(--display); font-size: 1.2rem; font-weight: 800; letter-spacing: -.03em; }
    #meetC .cw-times small { font-size: .78rem; color: var(--sub); text-align: right; }
    .widget.dst { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn-soft) 60%, var(--surface)); }
    .carbon .c-big b { font-size: clamp(3rem, 7vw, 4.4rem); }

    /* ── Popover ── */
    #backdrop { position: fixed; inset: 0; z-index: 90; display: none; }
    #backdrop.on { display: block; }
    #pop { position: fixed; z-index: 100; display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--pop-shadow); overflow: hidden; animation: popIn .16s ease; }
    #pop.on { display: block; }
    @keyframes popIn { from { opacity: 0; transform: translateY(-4px) scale(.985); } to { opacity: 1; transform: none; } }
    .pk-search { display: flex; align-items: center; gap: .6rem; padding: .85rem 1rem; border-bottom: 1px solid var(--line); color: var(--muted); }
    .pk-search input { flex: 1; border: none; outline: none; background: transparent; color: var(--text); font-family: var(--ui); font-size: .98rem; font-weight: 500; }
    .pk-search input::placeholder { color: var(--muted); }
    .chips { display: flex; gap: .35rem; padding: .7rem 1rem; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; border: 1px solid var(--line); background: var(--surface); color: var(--sub); font-size: .8rem; font-weight: 600; padding: .38rem .8rem; border-radius: 999px; cursor: pointer; transition: all .12s; white-space: nowrap; }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .chip.on { background: var(--text); border-color: var(--text); color: var(--bg); }
    .pop-label { font-size: .75rem; font-weight: 700; color: var(--muted); padding: .75rem 1rem .35rem; }
    .popular { display: flex; flex-wrap: wrap; gap: .35rem; padding: 0 1rem .8rem; border-bottom: 1px solid var(--line); }
    .popular .chip { display: flex; align-items: center; gap: .45rem; padding-left: .45rem; }
    #cityList { max-height: 340px; overflow-y: auto; padding: .3rem .5rem .55rem; }
    #cityList::-webkit-scrollbar { width: 8px; } #cityList::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }
    .grp { font-size: .75rem; font-weight: 700; color: var(--muted); padding: .8rem .6rem .3rem; position: sticky; top: 0; background: var(--surface); }
    .item { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: .7rem; width: 100%; text-align: left; padding: .55rem .6rem; border: none; background: transparent; border-radius: 11px; cursor: pointer; color: var(--text); font-size: .95rem; font-weight: 500; }
    .item:hover { background: var(--accent-soft); }
    .item.sel { font-weight: 700; color: var(--accent); }
    .item .code { font-size: .78rem; font-weight: 600; color: var(--muted); letter-spacing: .05em; }
    .empty { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: .9rem; }
    .cal { padding: .95rem; width: 310px; max-width: 100%; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .65rem; }
    .cal-title { font-family: var(--display); font-size: 1.02rem; font-weight: 700; text-transform: capitalize; }

    .leg-row { display: grid; grid-template-columns: auto minmax(0, 1.4fr) minmax(0, 1fr) auto auto; align-items: center; gap: .9rem; width: 100%; text-align: left; padding: .7rem .8rem; border: 1.5px solid transparent; border-radius: 14px; background: var(--surface-2); cursor: pointer; font-size: .92rem; font-variant-numeric: tabular-nums; }

    .carbon .c-body { display: grid; grid-template-columns: auto 1fr; gap: 2rem; align-items: center; padding: .4rem 1.5rem 1.5rem; }

    .wx-now { display: flex; align-items: center; gap: 1rem; padding: .2rem 1.5rem 0; }

    .c-none { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }

    .mt-ans { margin: 0 1.5rem; padding: 1.2rem 1.3rem; border-radius: 20px; background: var(--good-soft); }

    .mt-read b { display: block; font-family: var(--display); font-size: clamp(1.9rem, 4.5vw, 2.7rem); font-weight: 800; letter-spacing: -.045em; line-height: 1; }
    .mt-read em { font-style: normal; font-size: .76rem; font-weight: 700; padding: .18rem .6rem; border-radius: 999px; display: inline-block; margin-top: .5rem; background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--sub); }
    .mt-read em.work { background: var(--good-soft); color: var(--good); }
    .mt-read .eq { font-size: 1.5rem; color: var(--muted); }
    .mt-hint { font-size: .8rem; color: var(--muted); padding: .6rem 1.5rem 0; }
    footer { margin-top: 2.5rem; text-align: center; font-size: .8rem; color: var(--muted); line-height: 1.8; }

    @media (max-width: 1240px) {
      .layout { grid-template-columns: 1fr 1fr; }
      .stage-col { grid-column: 1 / -1; grid-row: 1; } .below { grid-column: 1 / -1; grid-row: 2; }
      #railL { grid-column: 1; grid-row: 3; } #railR { grid-column: 2; grid-row: 3; }
      .rail { contain: none; overflow: visible; align-content: flex-start; }
      .stage { height: auto; }
      .globe-wrap { height: auto; aspect-ratio: 16 / 10; min-height: 0; }
    }
    @media (max-width: 960px) {
      .planner { grid-template-columns: 1fr 1fr; }
      .route-row { grid-column: 1 / -1; }
      .span-7, .span-5, .span-6 { grid-column: span 12; }
    }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .stage-col, .below, #railL, #railR { grid-column: 1; }
      .stage-col { grid-row: 1; } .below { grid-row: 2; } #railL { grid-row: 3; } #railR { grid-row: 4; }
      .globe-wrap { aspect-ratio: 1 / 1.18; min-height: 0; }
      .clocks { grid-template-columns: 1fr 1fr; right: 56px; }
      .clock { padding: .3rem .5rem; } .clock .c-time { font-size: .92rem; }
      .widget.open { width: 100vw; max-height: 100vh; height: 100vh; border-radius: 0; }
      .widget.open .w-ph { display: none; }
    }
    @media (max-width: 700px) {
      body { padding: 1.1rem .85rem 4rem; }
      .top-bar { flex-direction: column; align-items: flex-start; }
      .tools { order: -1; }
      .planner { grid-template-columns: 1fr; }
      .route-row { grid-template-columns: 1fr; }
      .swap-btn { margin: -.1rem auto; transform: rotate(90deg); }
      .swap-btn:hover { transform: rotate(270deg); }
      .tk-top { grid-template-columns: 1fr 1fr; padding: 1.4rem 1.2rem; }
      .tk-mid { grid-column: 1 / -1; grid-row: 2; padding: .2rem 0; }
      .tk-facts { grid-template-columns: 1fr 1fr 1fr; padding: 1.1rem 1.2rem 1.3rem; gap: .5rem; }
      .fact b { font-size: 1.2rem; }
      .tk-perf::before { left: -1.6rem; } .tk-perf::after { right: -1.6rem; }
      .plan-rail { grid-template-columns: 1fr; padding: 1rem 1.2rem 1.4rem; gap: 0; }
      .plan-rail::before { left: calc(1.2rem + 6.5px); right: auto; top: 1.4rem; bottom: 2rem; width: 3px; height: auto; background: linear-gradient(180deg, #7a86ff, var(--sun) 50%, var(--dest)); }
      .step { padding: 0 0 1.2rem 2rem; }
      .step .node { position: absolute; left: 0; top: .2rem; margin: 0; }
      .step.travel .node { margin: -3px 0 0 -3px; }
      #pop { left: 0 !important; right: 0 !important; top: auto !important; bottom: 0; width: auto !important; border-radius: 24px 24px 0 0; animation: sheet .22s ease; }
      @keyframes sheet { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
      #backdrop.on { background: rgba(5, 8, 20, .5); }
      .cal, .bed { width: 100%; padding-bottom: 1.3rem; }
      #cityList { max-height: 46vh; }
      .tips { grid-template-columns: 1fr; }
      .mt-ctrl, .mt-key, .mt-hint { padding-left: 1.2rem; padding-right: 1.2rem; } .mt-ans, .mt-board, .mt-read { margin-left: 1.2rem; margin-right: 1.2rem; }
      .mt-board { grid-template-columns: 52px 1fr; padding: .8rem .7rem; } .mt-lcol small { display: none; }
      .ans-row { grid-template-columns: 1fr; gap: .6rem; margin-top: .8rem; } .mt-axis span.hide-m { display: none; } .seg-b { font-size: .6rem; letter-spacing: -.02em; }
      .mt-read { grid-template-columns: 1fr; gap: .8rem; } .mt-read .eq { display: none; }

      .wx-strip { grid-template-columns: repeat(4, 1fr); } .wx-stats, .wx-now, .dst-list, .wx-msg { padding-left: 1.2rem; padding-right: 1.2rem; }
      .stop-row { grid-template-columns: 1fr auto; } .stay { grid-column: 1 / -1; } .stop-row .trigger { grid-column: 1; } .rm { margin-bottom: 0; }
      .sum-top { grid-template-columns: 1fr 1fr; padding: .4rem 1.2rem 1rem; }
      .leg-row { grid-template-columns: auto 1fr auto; } .leg-row .l-time, .leg-row .l-co2 { display: none; }
      .carbon .c-body { grid-template-columns: 1fr; gap: 1rem; padding: .4rem 1.2rem 1.4rem; } .c-head { padding: 0 1.2rem 0 0; }
      .dl-stats { grid-template-columns: 1fr 1fr 1fr; padding: .3rem 1.2rem 1rem; }
      .advice, .ol-head, .ol-big, .meter, .ol-text, .panel-h { padding-left: 1.2rem; padding-right: 1.2rem; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<div class="container">

  <header class="top-bar">
    <div>
      <h1 data-i18n="title"></h1>
      <p class="subtitle" data-i18n="subtitle"></p>
    </div>
    <div class="tools">
      <div class="seg" id="langSeg" role="group" aria-label="Language">
        <button data-l="en">EN</button><button data-l="fr">FR</button>
      </div>
      <button class="icon-btn" id="themeBtn" data-i18n-title="theme" aria-label="Toggle dark mode">
        <svg id="iconSun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
        <svg id="iconMoon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="planner" aria-label="Trip">
    <div class="route-row">
      <div class="field"><span class="label" data-i18n="from"></span><button class="trigger" id="fromBtn" type="button"></button></div>
      <button class="swap-btn" id="swapBtn" data-i18n-title="swap" aria-label="Swap cities" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>
      </button>
      <div class="field"><span class="label" data-i18n="to"></span><button class="trigger" id="toBtn" type="button"></button></div>
    </div>
    <div class="field"><span class="label" data-i18n="departure"></span><button class="trigger" id="deptBtn" type="button"></button></div>
    <div class="field"><span class="label" data-i18n="bedtime"></span><button class="trigger" id="bedBtn" type="button"></button></div>
  </section>

  <div class="stops" id="stops"></div>

  

  <div class="layout">
    <aside class="rail" id="railL"></aside>
    <main class="stage-col">
      <section class="stage">
        <div class="globe-wrap" id="mapWrap">
          <canvas id="globe"></canvas>
          <div id="mapTip"></div>
          <div class="clocks">
            <div class="clock"><i style="background:var(--origin)"></i><span class="c-code" id="ckFromC"></span><span class="c-time" id="ckFromT"></span></div>
            <div class="clock"><i style="background:var(--dest)"></i><span class="c-code" id="ckToC"></span><span class="c-time" id="ckToT"></span></div>
          </div>
          <div class="map-ctrls">
            <button id="zIn" type="button" aria-label="Zoom in">+</button>
            <button id="zOut" type="button" aria-label="Zoom out">−</button>
            <button id="zFit" type="button" data-i18n-title="fit" aria-label="Fit route">⤢</button>
          </div>
          <div class="flightbar">
            <button class="play" id="playBtn" type="button" aria-label="Play"></button>
            <div class="scrub-wrap">
              <div class="scrub-top"><span id="elapsed"></span><span id="remain"></span></div>
              <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Flight progress" />
            </div>
          </div>
        </div>
      </section>
    </main>
    <aside class="rail" id="railR"></aside>
    <div class="below">
      <p class="map-hint" data-i18n="mapHint"></p>
      <div class="leg-tabs" id="legTabs"></div>
      <div id="ticketSlot"></div>
    </div>
  </div>

  <footer>
    <p data-i18n="foot1"></p>
    <p data-i18n="foot2"></p>
  </footer>
</div>

<div id="backdrop"></div>
<div id="wBackdrop"></div>
<div id="pop" role="dialog"></div>

/* ══ Maths / formatting ════════════════════════════════════════════════════ */
function distanceKm(a, b) {
  const R = 6371;
  const h = Math.sin((b.lat - a.lat) * rad / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin((b.lng - a.lng) * rad / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function flightHours(km) {
  const speed = km < 800 ? 600 : km < 2000 ? 720 : km < 5000 ? 820 : 870;
  return km / speed + (km < 1500 ? 0.5 : 0.75);
}
function tzOffset(tz, instant) {
  const p = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', second: 'numeric' })
    .formatToParts(instant).reduce((o, x) => (o[x.type] = x.value, o), {});
  return (Date.UTC(p.year, p.month - 1, p.day, p.hour, p.minute, p.second) - Math.floor(instant.getTime() / 1000) * 1000) / 3600000;
}
function localToInstant(str, tz) {

  return new Date(naive.getTime() - tzOffset(tz, g) * 3600000);
}
const fmtDate = (inst, tz) => new Intl.DateTimeFormat(LOC(), { timeZone: tz, weekday: 'short', day: 'numeric', month: 'short' }).format(inst);
const fmtTime = (inst, tz) => new Intl.DateTimeFormat(LOC(), { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(inst);
function fmtDur(mins) {
  mins = Math.max(0, Math.round(mins));
  const h = Math.floor(mins / 60), m = mins % 60;
  if (lang === 'fr') return h ? `${h} h ${pad(m)}${m ? '' : ''}`.replace(/ 00$/, '') + (m ? ' min' : '') : `${m} min`;
  return h ? `${h}h ${pad(m)}m` : `${m}m`;
}
function fmtDuration(h) {
  const m = Math.round(h * 60), hh = Math.floor(m / 60), mm = pad(m % 60);
  return lang === 'fr' ? `${hh} h ${mm}` : `${hh}h ${mm}m`;
}
function fmtClock(mins) {
  mins = ((Math.round(mins) % 1440) + 1440) % 1440;
  const h = Math.floor(mins / 60), m = mins % 60;
  if (lang === 'fr') return m ? `${h} h ${pad(m)}` : `${h} h`;
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${h12}${m ? ':' + pad(m) : ''}${h < 12 ? 'am' : 'pm'}`;
}
const fmtHM = mins => { mins = ((Math.round(mins) % 1440) + 1440) % 1440; return `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`; };
function fmtOffset(h) {
  const sign = h > 0 ? '+' : h < 0 ? '−' : '±';
  const a = Math.abs(h), hh = Math.floor(a), mm = Math.round((a - hh) * 60);
  return `${sign}${hh}${mm ? ':' + pad(mm) : ''}${lang === 'fr' ? ' h' : 'h'}`;
}
const fmtHours = h => (h % 1 ? h.toFixed(1) : String(h)).replace('.', lang === 'fr' ? ',' : '.');
const fmtNum = n => Math.round(n).toLocaleString(LOC());
function parseDept(s) { return { y: +s.slice(0, 4), m: +s.slice(5, 7), d: +s.slice(8, 10), hh: +s.slice(11, 13), mm: +s.slice(14, 16) }; }
function buildDept(o) { return `${o.y}-${pad(o.m)}-${pad(o.d)}T${pad(o.hh)}:${pad(o.mm)}`; }

/* ══ Sun position ══════════════════════════════════════════════════════════ */
function sunPos(ms) {
  const d = ms / 86400000 + 2440587.5 - 2451545.0;
  const g = (357.529 + 0.98560028 * d) * rad;
  const q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad;
  const e = (23.439 - 0.00000036 * d) * rad;
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
  const gmst = (((18.697374558 + 24.06570982441908 * d) % 24) + 24) % 24;

/* ══ Popover ═══════════════════════════════════════════════════════════════ */
const pop = $('pop'), backdrop = $('backdrop');
let popType = null, popAnchor = null, popIdx = 0, region = 'all', query = '', calView = null;

function placePop() {
  if (window.innerWidth <= 700) { pop.style.left = pop.style.top = ''; return; }
  const r = popAnchor.getBoundingClientRect();
  pop.style.width = isCityPop() ? Math.max(r.width, 360) + 'px' : '';
  const w = pop.offsetWidth, h = pop.offsetHeight;
  const left = Math.min(Math.max(12, r.left), window.innerWidth - w - 12);
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 12) top = Math.max(12, r.top - h - 8);

}
const isCityPop = () => popType === 'from' || popType === 'to' || popType === 'stop';
function openPop(type, anchor, idx) {

  popType = type; popAnchor = anchor; popIdx = type === 'from' ? 0 : type === 'to' ? 1 : idx; anchor.classList.add('open');
  region = 'all'; query = '';
  if (type === 'dept') { const o = parseDept(state.dept); calView = { y: o.y, m: o.m }; }
  renderPop();

backdrop.addEventListener('click', closePop);

function renderPop() {

function renderCityPicker() {

  const pops = POPULAR.map(code => { const i = byCode(code), c = CITIES[i]; return `<button class="chip" data-city="${i}">${flag(c.cc, 'sm')}${cname(c)}</button>`; }).join('');
  pop.innerHTML = `

function fillCityList(sel) {

function dayInfo(c, aI) {

/* ══ Clock changes (DST) ═══════════════════════════════════════════════════ */
function clockChanges(tz, a, b) {
  const out = []; const H = 3600000;

    const cur = tzOffset(tz, new Date(Math.min(t0, b)));
    if (cur !== prev) {
      let lo = t0 - H, hi = t0;
      while (hi - lo > 60000) { const mid = Math.floor((lo + hi) / 2); if (tzOffset(tz, new Date(mid)) === prev) lo = mid; else hi = mid; }
      out.push({ at: hi, before: prev, after: cur }); prev = cur;
    }
    if (t0 >= b) break;
  }
  return out;
}
function dstAlerts(L) {
  const D = 86400000, items = [];
  const visit = (c, a, b, when) => clockChanges(c.tz, a, b).forEach(ev => {
    if (items.some(x => x.tz === c.tz && x.at === ev.at)) return;
    const wall = new Date(ev.at + ev.before * 3600000);
    const d = new Intl.DateTimeFormat(LOC(), { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short' }).format(wall);
    const tm = new Intl.DateTimeFormat(LOC(), { timeZone: 'UTC', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(wall);
    const n = Math.abs(ev.after - ev.before);
    items.push({ tz: c.tz, at: ev.at, text: t('dstGo')(cname(c), ev.after > ev.before ? 'fwd' : 'back', fmtHours(n), d, tm), when });
  });
  visit(L[0].from, L[0].dI.getTime() - 4 * D, L[0].dI.getTime(), 'dstBefore');
  for (let j = 1; j < L.length; j++) visit(L[j].from, L[j - 1].aI.getTime(), L[j].dI.getTime(), 'dstDuring');
  const last = L[L.length - 1];
  visit(last.to, last.aI.getTime(), last.aI.getTime() + 4 * D, 'dstAfter');
  return items.sort((x, y) => x.at - y.at);
}

$('scrub').addEventListener('input', e => { pause(); fl.p = +e.target.value / 1000; drawFlight(false); syncPlay(); });
function updateGlobe(fit) { if (fit) fitView(); V.dirty = true; }

const ICO_EXP = '<svg class="ic-e" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>';
const ICO_X = '<svg class="ic-x" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
function widget(id, title, compact, full, cls) {
  return `<section class="widget ${cls || ''}" data-w="${id}" id="w-${id}"><header class="w-head"><h2>${Array.isArray(title) ? `<span class="t-s">${title[0]}</span><span class="t-l">${title[1]}</span>` : title}</h2><button class="w-exp" data-expand="${id}" type="button" aria-label="${t('expand')}" title="${t('expand')}">${ICO_EXP}${ICO_X}</button></header>
    <div class="w-compact">${compact}</div><div class="w-full ${id === 'wx' ? 'keep-title' : ''}">${full}</div></section>`;
}
function fitRails() {
  const w = $('mapWrap'); w.style.minHeight = '';
  if (!window.matchMedia('(min-width: 1241px)').matches) return;
  const need = Math.max($('railL').scrollHeight, $('railR').scrollHeight) - 2;
  if (need > w.clientHeight) w.style.minHeight = need + 'px';
}
window.addEventListener('resize', fitRails);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitRails);
let openW = null, flyDone = null;
const EASE = 'cubic-bezier(.22,1,.36,1)';
const px = r => ({ left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
function setBox(el, r) { Object.assign(el.style, px(r)); }
function clearBox(el) { ['left', 'top', 'width', 'height', 'inset', 'margin', 'overflow'].forEach(k => el.style[k] = ''); }
function openWidget(w, animate) {
  const first = w.getBoundingClientRect();
  const ph = document.createElement('div'); ph.className = 'w-ph' + (w.classList.contains('half') ? ' half' : ''); ph.style.minHeight = first.height + 'px';
  w.before(ph); w._ph = ph;
  w.classList.add('open');
  if (!animate || reduceMotion) return;
  const last = w.getBoundingClientRect();
  w.style.inset = 'auto'; w.style.margin = '0'; w.style.overflow = 'hidden'; setBox(w, last);
  const a = w.animate([px(first), px(last)], { duration: 460, easing: EASE });
  const f = w.querySelector('.w-full').animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 340, delay: 150, easing: EASE, fill: 'backwards' });
  const done = () => { clearBox(w); flyDone = null; };
  flyDone = () => { a.cancel(); f.cancel(); done(); };
  a.onfinish = done;
}
function closeWidget(w, animate) {
  const ph = w._ph;
  if (!animate || reduceMotion || !ph) { w.classList.remove('open'); clearBox(w); if (ph) ph.remove(); return; }
  const from = w.getBoundingClientRect(), to = ph.getBoundingClientRect();
  w.classList.remove('open'); w.classList.add('flying'); setBox(w, from);
  const a = w.animate([px(from), px(to)], { duration: 380, easing: EASE });
  const f1 = w.querySelector('.w-full').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' });
  const f2 = w.querySelector('.w-compact').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, delay: 120, easing: 'ease-out', fill: 'backwards' });
  const done = () => { w.classList.remove('flying'); clearBox(w); ph.remove(); flyDone = null; };
  flyDone = () => { a.cancel(); f1.cancel(); f2.cancel(); done(); };
  a.onfinish = done;
}
function setOpen(id, instant) {
  if (flyDone) flyDone();
  const prev = document.querySelector('.widget.open');
  if (prev && prev.dataset.w === id) return;
  openW = id;
  const next = id ? $('w-' + id) : null;
  if (prev) closeWidget(prev, !instant && !next);
  if (next) openWidget(next, !instant);
  $('wBackdrop').classList.toggle('on', !!id); document.body.classList.toggle('lock', !!id);
}

function renderResults() {
  const { from, to, km, hrs, dI, aI, shift, dept, carbon } = trip(), L = legs();
  const abs = Math.abs(shift);
  const sev = abs === 0 ? 'none' : abs <= 3 ? 'mild' : abs <= 6 ? 'moderate' : 'severe';
  const dir = shift > 0 ? 1 : -1;
  const days = Math.max(1, Math.ceil(abs * (dir > 0 ? 1 : 0.7)));
  const dayDiff = (() => { const k = (inst, tz) => new Intl.DateTimeFormat('en-CA', { timeZone: tz }).format(inst); return Math.round((Date.parse(k(aI, to.tz)) - Date.parse(k(dI, from.tz))) / 86400000); })();
  const landsTxt = dayDiff === 0 ? t('landsSame') : dayDiff > 0 ? t('landsNext') : t('landsPrev');
  const left = [], right = [];

  // ticket (centre)
  const ticket = `
  <article class="panel ticket">
    <div class="tk-top">
      <div class="tk-city">${flag(from.cc, 'lg')}<div class="tk-code">${from.code}</div><div class="tk-name">${cname(from)}</div><div class="tk-when"><b>${fmtTime(dI, from.tz)}</b>${fmtDate(dI, from.tz)}</div></div>
      <div class="tk-mid"><div class="tk-dur">${km ? fmtDuration(hrs) : '—'}</div><div class="tk-line"><span></span>✈<span></span></div></div>
      <div class="tk-city to">${flag(to.cc, 'lg')}<div class="tk-code">${to.code}</div><div class="tk-name">${cname(to)}</div><div class="tk-when">${fmtDate(aI, to.tz)}<b style="margin:0 0 0 .4rem">${km ? fmtTime(aI, to.tz) : '—'}</b></div></div>
    </div>
    <div class="tk-perf"></div>
    <div class="tk-facts">
      <div class="fact"><b>${fmtNum(km)} km</b><span>${t('distance')}</span></div>
      <div class="fact"><b>${fmtNum(km * 0.621371)}</b><span>${t('miles')}</span></div>
      <div class="fact"><b>${landsTxt}</b><span>${t('lands')}</span></div>
    </div>
  </article>`;

  // clock changes
  const dst = dstAlerts(L);
  if (dst.length) left.push(widget('dst', t('dstTitle'),
    `<p class="cw-sub strong">${dst[0].text}</p><p class="cw-sub">${t(dst[0].when)}${dst.length > 1 ? ` · ${t('moreN')(dst.length - 1)}` : ''}</p>`,
    `<ul class="dst-list">${dst.map(x => `<li><b>${x.text}</b>, ${t(x.when)}.</li>`).join('')}<li>${t('dstNote')}</li></ul>`, 'dst'));

  // trip summary
  if (L.length > 1) {
    const totKm = L.reduce((a, x) => a + x.km, 0), totH = L.reduce((a, x) => a + x.hrs, 0), totC = L.reduce((a, x) => a + x.carbon.kg, 0);
    const tdays = Math.max(1, Math.round((L[L.length - 1].aI - L[0].dI) / 86400000));
    left.push(widget('trip', t('tripTitle'),
      `<div class="cw-top"><div><span class="cw-big">${L.length}</span> <span class="cw-unit">${t('legsWord')}</span></div></div><p class="cw-sub">${fmtNum(totKm)} km · ${fmtDuration(totH)} · ${fmtKg(totC)} kg CO₂e · ${t('tripDays')(tdays)}</p>`,
      `<div class="panel-h"><p class="panel-sub">${t('tripSub')}</p></div>
      <div class="sum-top"><div><b>${fmtNum(totKm)} km</b><span>${t('totDist')}</span></div><div><b>${fmtDuration(totH)}</b><span>${t('totFlight')}</span></div><div><b>${fmtKg(totC)} kg</b><span>${t('totCo2')}</span></div><div><b>${t('tripDays')(tdays)}</b><span>${t('tripLen')}</span></div></div>
      <div class="sum-list">${L.map((x, i) => `<button class="leg-row ${i === Math.min(state.leg, L.length - 1) ? 'on' : ''}" data-leg="${i}" type="button">
        <span class="fls">${flag(x.from.cc, 'sm')}${flag(x.to.cc, 'sm')}</span>
        <span><b>${x.from.code} → ${x.to.code}</b><small>${cname(x.from)} → ${cname(x.to)}</small></span>
        <span class="l-time">${fmtDate(x.dI, x.from.tz)}, ${fmtTime(x.dI, x.from.tz)}<small>${fmtTime(x.aI, x.to.tz)} ${fmtDate(x.aI, x.to.tz)}</small></span>
        <span>${fmtDuration(x.hrs)}</span><span class="l-co2">${fmtKg(x.carbon.kg)} kg</span></button>`).join('')}</div>`));
  }

  // jet lag
  const sevCol = { none: 'var(--good)', mild: 'var(--good)', moderate: 'var(--warn)', severe: 'var(--bad)' }[sev];
  const meterOn = abs === 0 ? 0 : Math.min(6, Math.max(1, Math.ceil(abs / 2)));
  const meter = `<div class="meter">${[1, 2, 3, 4, 5, 6].map(n => `<i class="${n <= meterOn ? 'on' : ''}"></i>`).join('')}</div>`;
  left.push(widget('jl', t('olTitle'),
    abs === 0 ? `<div class="cw-top"><span class="cw-big sm">${t('sev_none')}</span></div><p class="cw-sub">${t('sameTz')}</p>`
      : `<div class="cw-top"><div><span class="cw-big">${days}</span> <span class="cw-unit">${t('daysToAdjust')(days)}</span></div><span class="badge badge-${sev}">${t('sev_' + sev)}</span></div>${meter}<p class="cw-sub">${t('timeShift')} ${fmtOffset(shift)} · ${dir > 0 ? t('east') : t('west')}</p>`,
    `<div class="outlook" style="--sev:${sevCol}"><div class="ol-head"><div><p class="panel-sub" style="margin:0">${t('timeShift')} ${fmtOffset(shift)}</p></div><span class="badge badge-${sev}">${t('sev_' + sev)}</span></div>
    ${abs === 0 ? `<div class="ol-text" style="margin-top:0">${t('sameTz')}</div>`
      : `<div class="ol-big"><b>${days}</b><span>${t('daysToAdjust')(days)}</span></div>${meter}
         <div class="ol-facts"><div><b>${dir > 0 ? t('east') : t('west')}</b><span>${t('direction')}</span></div><div><b>${dir > 0 ? '1' : '0,7'.replace(',', lang === 'fr' ? ',' : '.')} ${t('dayPerH')}</b><span>${t('recovery')}</span></div></div>
         <p class="ol-text">${t('summary')(dir, fmtHours(abs), days)}</p>`}</div>`, 'jl'));

  // sleep plan + tips
  if (abs !== 0) {
    const rows = buildSchedule(shift, dept);
    const mini = `<div class="mini-rail">${rows.map((r, i) => `<i class="${r.travel ? 'tv' : r.post ? 'po' : 'pr'}"></i>`).join('')}</div>`;
    left.push(widget('sp', t('planTitle'), `${mini}<p class="cw-sub strong">${t('sleepCompact')(rows[0].bed, rows[1].bed, rows[2].bed)}</p><p class="cw-sub">${t('travel')}: ${rows[3].date}</p>`,
      `<div class="panel-h"><p class="panel-sub">${t('planSub')}${state.leg > 0 ? ' ' + t('planLegNote')(cname(from)) : ''}</p></div>
      <div class="plan-rail">
      ${rows.map(r => `<div class="step ${r.travel ? 'travel' : ''} ${r.post ? 'post' : ''}"><div class="node"></div>
        <div class="day">${r.day}</div><div class="date">${r.date || '&nbsp;'}</div>
        <div class="bed">${r.travel ? r.bed : `${t('bed')} ${r.bed}`}${r.wake ? `<small>${r.wake}</small>` : ''}</div>
        <div class="note">${r.note}</div></div>`).join('')}
    </div>`));
    const hh = fmtOffset(abs).slice(1), dN = cname(to), oN = cname(from);
    const tdLine = shift > 0 ? t('tdAhead')(dN, oN, hh) : t('tdBehind')(dN, oN, hh);
    const utcF = h => 'UTC' + fmtOffset(h).replace('±', '+').replace(/ ?h$/, '').replace('h', '');
    left.push(widget('td', [t('tdShort'), t('tdLong')],
      `<div class="cw-top"><span class="cw-big">${fmtOffset(shift)}</span></div><p class="cw-sub">${tdLine}</p>`,
      `<div class="panel-h"><p class="panel-sub">${tdLine}</p></div><div class="w-facts"><div><b>${utcF(tzOffset(from.tz, dI))}</b><span>${oN} · ${t('utcLbl')}</span></div><div><b>${utcF(tzOffset(to.tz, aI))}</b><span>${dN} · ${t('utcLbl')}</span></div><div><b>${fmtOffset(shift)}</b><span>${t('diffLbl')}</span></div></div><p class="w-note">${t('tdNote')}</p>`, 'half'));
    left.push(widget('bc', [t('bcTitle'), t('bcLong')],
      `<div class="cw-top"><span class="cw-big">${fmtTime(aI, from.tz)}</span></div><p class="cw-sub">${t('bcSub')(oN)}</p>`,
      `<div class="panel-h"><p class="panel-sub">${t('bcLead')(oN)}</p></div><div class="w-facts"><div><b>${fmtTime(aI, to.tz)}</b><span>${t('bcLanding')} · ${dN}</span></div><div><b>${fmtTime(aI, from.tz)}</b><span>${t('bcBody')(oN)}</span></div></div><p class="w-note">${t('bcBed')(oN, fmtHM(state.bed), dN, fmtHM(state.bed + shift * 60))}</p>`, 'half'));
    const tips = [dir > 0 ? t('tipEast') : t('tipWest'), t('tip2'), t('tip3'), t('tip4')];
    left.push(widget('tips', t('tipsTitle'), `<p class="cw-sub clamp2">${tips[0]}</p><p class="cw-sub">${t('moreN')(3)}</p>`, `<ul class="tips">${tips.map(x => `<li>${x}</li>`).join('')}</ul>`));
  }

  // daylight
  const info = dayInfo(to, aI), win = lightWindows(info, shift);
  let landLine;
  if (info.allUp) landLine = t('polarUp');
  else if (info.allDown) landLine = t('polarDown');
  else if (info.up) landLine = t('landDay')(fmtDur(info.set - info.landMin));
  else if (info.landMin > info.set) landLine = t('landAfterSet')(fmtDur(info.landMin - info.set));
  else landLine = t('landBeforeRise')(fmtDur(info.rise - info.landMin));
  const dayLenMin = info.rise !== null && info.set !== null ? info.set - info.rise : (info.allUp ? 1440 : 0);
  const dlStats = `<div class="dl-stats"><div><b>${info.rise === null ? '—' : fmtHM(info.rise)}</b><span>${t('sunrise')}</span></div><div><b>${info.set === null ? '—' : fmtHM(info.set)}</b><span>${t('sunset')}</span></div><div><b>${fmtDur(dayLenMin)}</b><span>${t('dayLen')}</span></div></div>`;
  right.push(widget('dl', t('dayTitle')(cname(to)),
    `<p class="cw-sub strong">${landLine}</p><div class="cw-stats"><div><b>${info.rise === null ? '—' : fmtHM(info.rise)}</b><span>${t('sunrise')}</span></div><div><b>${info.set === null ? '—' : fmtHM(info.set)}</b><span>${t('sunset')}</span></div></div>`,
    `<div class="panel-h"><p class="panel-sub">${landLine}</p></div><div class="dl-chart">${daylightChart(info, win, to)}</div>${dlStats}
    ${win && abs > 0 ? `<div class="advice">
      <div class="adv seek"><i></i><div><b>${t('seek')}: ${fmtHM(win.seek[0])}–${fmtHM(win.seek[1])}</b><small>${t(win.why)}</small></div></div>
      <div class="adv avoid"><i></i><div><b>${t('avoid')}: ${fmtHM(win.avoid[0])}–${fmtHM(win.avoid[1])}</b><small>${t(win.av)}</small></div></div>
    </div>` : '<div style="height:1.1rem"></div>'}`));

  if (km) {
    right.push(widget('wx', t('wxTitle'), `<div class="wxc" id="wxcFrom"></div><div class="wxc" id="wxcTo"></div>`, `<div id="wxFrom"></div><div id="wxTo"></div>`));
    right.push(widget('mt', t('meetTitle'), `<div id="meetC"></div>`, `<div id="meet"></div>`));
    const cabs = ['economy', 'premium', 'business', 'first'];
    const totC = L.reduce((a, x) => a + x.carbon.kg, 0), cb = carbon;
    right.push(widget('co', [t('carbonShort'), t('carbonTitle')],
      `<div class="cw-top"><div><span class="cw-big">${fmtKg(cb.kg)}</span> <span class="cw-unit">kg CO₂e</span></div></div><p class="cw-sub">${t('perPaxS')}${cb.band === 'domestic' ? '' : ' · ' + t('cab_' + state.cabin).toLowerCase()}</p>`,
      `<div class="c-head"><div class="panel-h"></div>
      ${cb.band === 'domestic' ? '' : `<div class="seg" role="group" aria-label="${t('cabin')}">${cabs.map(c => `<button data-cabin="${c}" class="${state.cabin === c ? 'on' : ''}" type="button">${t('cab_' + c)}</button>`).join('')}</div>`}</div>
      <div class="c-body"><div class="c-big"><b>${fmtKg(cb.kg)}</b><span>${t('perPax')}</span></div>
      <p class="c-note"><b>${t('factorTxt')(t('band_' + cb.band), cb.band === 'domestic' ? '' : t('cab_' + state.cabin).toLowerCase(), String(cb.f).replace('.', lang === 'fr' ? ',' : '.'))}</b>${cb.band === 'domestic' ? ' ' + t('domNote') : ''}${L.length > 1 ? ` ${t('wholeTrip')}: <b>${fmtKg(totC)} kg CO₂e</b>.` : ''}<br>${t('carbonNote')}</p></div>`, 'half carbon'));
    const pct = km / (2 * Math.PI * 6371) * 100, pctTxt = (pct < 10 ? pct.toFixed(1) : String(Math.round(pct))).replace('.', lang === 'fr' ? ',' : '.');
    right.push(widget('aw', [t('awShort'), t('awLong')],
      `<div class="cw-top"><span class="cw-big">${pctTxt}%</span></div><p class="cw-sub">${t('awSub')}</p>`,
      `<div class="panel-h"><p class="panel-sub">${t('awSub')}</p></div><div class="w-facts"><div><b>${fmtNum(km)} km</b><span>${t('distance')}</span></div><div><b>${fmtNum(km * 0.621371)}</b><span>${t('miles')}</span></div><div><b>${pctTxt}%</b><span>${t('awOf')}</span></div><div><b>${fmtDuration(hrs)}</b><span>${t('awFlight')}</span></div></div><p class="w-note">${t('awNote')}</p>`, 'half'));
  }

  $('railL').innerHTML = left.join(''); $('railR').innerHTML = right.join(''); $('ticketSlot').innerHTML = ticket;
  if (openW && !$('w-' + openW)) openW = null;
  setOpen(openW, true); fitRails();
  if (km) { wxFill($('wxFrom'), from, dI, 'wxDep', $('wxcFrom')); wxFill($('wxTo'), to, aI, 'wxArr', $('wxcTo')); renderMeeting(); }
}
document.addEventListener('click', e => {
  const x = e.target.closest('[data-expand]');
  if (x) { setOpen(openW === x.dataset.expand ? null : x.dataset.expand); return; }
  const r = e.target.closest('[data-leg]'); if (r) { selectLeg(+r.dataset.leg); return; }
  const c = e.target.closest('[data-cabin]'); if (c) { state.cabin = c.dataset.cabin; renderResults(); return; }
  const m = e.target.closest('[data-mt]'); if (m) {
    const [k, v] = m.dataset.mt.split(':'), d = +v, mt = state.mt;
    if (k === 'day') mt.day += d;
    else if (k === 'ws') mt.ws = Math.min(mt.we - 1, Math.max(0, mt.ws + d));
    else if (k === 'we') mt.we = Math.min(24, Math.max(mt.ws + 1, mt.we + d));
    renderMeeting(); return;
  }
  const cw = e.target.closest('.w-compact'); if (cw) setOpen(cw.closest('.widget').dataset.w);
});
$('wBackdrop').addEventListener('click', () => setOpen(null));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openW) setOpen(null); });
document.addEventListener('input', e => { if (e.target.id === 'mtTime') { state.mt.time = +e.target.value; updateMeetRead(); } });
function renderLegTabs() {
  const L = legs(), box = $('legTabs');
  box.innerHTML = L.length > 1 ? L.map((x, i) => `<button class="chip ${i === Math.min(state.leg, L.length - 1) ? 'on' : ''}" data-tab="${i}" type="button">${t('leg')(i + 1)}: ${x.from.code} → ${x.to.code}</button>`).join('') : '';
}
$('legTabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) selectLeg(+b.dataset.tab); });
function selectLeg(i) { state.leg = i; update(false); pause(); fl.p = 0; V.follow = false; drawFlight(false); if (!reduceMotion) play(); else { fl.p = 1; drawFlight(false); syncPlay(); } }

/* ══ Update / theme / language ═════════════════════════════════════════════ */
function update(fit) {
  renderTriggers(); renderResults(); renderLegTabs();
  prepFlight();
  if (fit) { pause(); fl.p = 0; }
  updateGlobe(!!fit);
  if (fit) { if (reduceMotion) { fl.p = fl.km ? 1 : 0; drawFlight(false); syncPlay(); } else { drawFlight(false); play(); } }
  else { drawFlight(false); syncPlay(); }
}

function applyTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  $('iconSun').style.display = dark ? 'block' : 'none';
  $('iconMoon').style.display = dark ? 'none' : 'block';
  try { localStorage.setItem('jetlag-theme', dark ? 'dark' : 'light'); } catch (e) {}
  V.dirty = true;
}
$('themeBtn').addEventListener('click', () => applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark'));
try {
  const sv = localStorage.getItem('jetlag-theme');
  applyTheme(sv ? sv === 'dark' : true);
} catch (e) {}

document.querySelectorAll('#langSeg button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.l; closePop();
  try { localStorage.setItem('jetlag-lang', lang); } catch (e) {}
  applyStatic(); update(false);
}));

applyStatic();
sizeGlobe();
update(true);
</script>
</body>
</html>
